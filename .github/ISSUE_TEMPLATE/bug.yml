name: Bug report
description: Something in Flock is wrong or broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Does it happen in demo mode (`npm run demo`) too?
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Flock commit or release, n8n version and edition, Node version
  - type: markdown
    attributes:
      value: "Please don't paste API keys, tokens or real customer data. For a security problem, see SECURITY.md instead."
