<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flock — workflow builder</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="shell" id="shell">
  <main class="main">
    <header class="topbar">
      <div class="topbar-title">
        <h1 id="wf-title">Workflows</h1>
        <p id="wf-sub">Pick a workflow, or ask Shepherd to draw a new one.</p>
      </div>
      <div class="topbar-actions">
        <span class="pill" id="wf-state">—</span>
        <button class="btn btn-sm" id="history-btn" type="button" hidden>History</button>
        <a class="btn btn-sm btn-n8n" id="open-n8n" href="#" target="_blank" rel="noopener" hidden><img src="/vendor/logos/n8n.svg" alt="" width="16" height="16">Open in n8n</a>
      </div>
    </header>
    <div class="builder-layout chat-below">
      <aside class="wf-pane" aria-label="Workflows">
        <div class="wf-pane-head">
          <input class="wf-search" id="wf-search" type="search" placeholder="Search workflows or systems…" aria-label="Search workflows">
          <div class="wf-filters" role="group" aria-label="Show">
            <button class="wf-filter" type="button" data-filter="all" aria-pressed="false">All</button>
            <button class="wf-filter" type="button" data-filter="on" aria-pressed="true">On</button>
            <button class="wf-filter" type="button" data-filter="off" aria-pressed="false">Off</button>
            <button class="wf-filter" type="button" data-filter="open" aria-pressed="false" title="Not infrastructure: anyone can organize these">Open</button>
          </div>
        </div>
        <div class="wf-list" id="wf-list"></div>
      </aside>
      <section class="canvas" aria-label="Workflow drawing" id="canvas-wrap">
        <div class="canvas-inner" id="canvas"><div class="loading">Loading workflows…</div></div>
        <div class="zoom-bar" id="zoom-bar" role="group" aria-label="Zoom" hidden>
          <button type="button" data-zoom="out" aria-label="Zoom out" title="Zoom out (⌘ −)">−</button>
          <button type="button" data-zoom="reset" id="zoom-level" title="Actual size">100%</button>
          <button type="button" data-zoom="in" aria-label="Zoom in" title="Zoom in (⌘ +)">+</button>
          <button type="button" data-zoom="fit" title="Fit to screen">Fit</button>
        </div>
      </section>
      <aside class="shepherd-panel" aria-label="Shepherd" id="shepherd-panel">
        <div class="shepherd-grip" id="shepherd-grip" role="separator" aria-orientation="horizontal" aria-label="Drag to resize Shepherd" title="Drag to resize · double-click to reset"></div>
        <div class="shepherd-head">
          <div class="shepherd-avatar" aria-hidden="true">S</div>
          <div style="flex:1; min-width:0;">
            <div style="font-size:14px; font-weight:600;">Shepherd</div>
            <div class="small muted">Builds it, checks it, keeps things tidy</div>
          </div>
        </div>
        <div class="chat" id="chat" aria-live="polite"></div>
        <div class="composer">
          <label for="ask">Ask Shepherd, or tell it what to build</label>
          <div class="composer-row">
            <textarea id="ask" rows="2" placeholder="e.g. What does the order-sync workflow do? · When a form is submitted, add a row to the sheet and post it to Slack"></textarea>
            <button class="send" id="send" type="button" aria-label="Send">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
            </button>
          </div>
          <span class="hint">Enter to send, Shift+Enter for a new line. Shepherd only ever creates an unpublished draft; you publish it in n8n.</span>
        </div>
      </aside>
    </div>
  </main>
</div>
<script type="module">
import { api, el, clear, renderSidebar, errorBanner, relativeTime, logo, systemStrip, orgInfo } from "/lib/ui.js";
import { layoutGraph, edgePath, extractEdges, LAYOUT } from "/lib/flow-graph.js";
import { glyphFor } from "/lib/glyphs.js";
import { logoForNode } from "/lib/logos.js";

const shell = document.getElementById("shell");
const canvas = document.getElementById("canvas");
const chat = document.getElementById("chat");
const ask = document.getElementById("ask");
const send = document.getElementById("send");
const title = document.getElementById("wf-title");
const sub = document.getElementById("wf-sub");
const ORG = await orgInfo();
const state = document.getElementById("wf-state");
const openN8n = document.getElementById("open-n8n");
const historyBtn = document.getElementById("history-btn");

let sidebarCounts = {};
let sheet = [];
let currentId = null;
// The chat so far (sent back each turn so Shepherd remembers it) and the draft
// on the canvas, so "change step 2" or an answer to a question revises it.
const turns = [];
let currentDraft = null;
let filter = "on";
const list = document.getElementById("wf-list");
const search = document.getElementById("wf-search");

function matches(w) {
  if (filter === "on" && !w.active) return false;
  if (filter === "off" && w.active) return false;
  if (filter === "open" && w.infra) return false;
  const q = search.value.trim().toLowerCase();
  if (!q) return true;
  return w.name.toLowerCase().includes(q) || (w.systems || []).some((s) => s.label.toLowerCase().includes(q)) || w.tags.some((t) => t.toLowerCase().includes(q));
}

function renderList() {
  clear(list);
  const rows = sheet.filter(matches);
  if (!rows.length) {
    list.append(el("div", { class: "empty", text: "No workflows match." }));
    return;
  }
  for (const w of rows) {
    list.append(
      el("button", {
        class: "wf-item",
        type: "button",
        "aria-current": w.id === currentId ? "true" : null,
        title: w.infra ? `Infrastructure: ${w.infraReasons[0]}` : null,
        onclick: () => openWorkflow(w.id)
      }, [
        el("span", { class: `wf-dot${w.active ? " on" : ""}`, title: w.active ? "On" : "Off" }),
        el("span", { style: { minWidth: "0" } }, [
          el("div", { class: "wf-item-name", text: w.name }),
          el("div", { class: "wf-item-meta" }, [systemStrip(w.systems || [], { max: 5 })])
        ]),
        w.infra ? el("span", { class: "wf-lock", "aria-label": "Infrastructure", text: "🔒" }) : el("span")
      ])
    );
  }
}

search.addEventListener("input", renderList);
for (const b of document.querySelectorAll(".wf-filter")) {
  b.addEventListener("click", () => {
    filter = b.dataset.filter;
    for (const o of document.querySelectorAll(".wf-filter")) o.setAttribute("aria-pressed", String(o === b));
    renderList();
  });
}

// Draws steps the way n8n connects them: branches side by side, merges
// rejoining, loops going round the side. Falls back to a plain list when the
// workflow has no connections to read.
const SVG = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs = {}, text) {
  const node = document.createElementNS(SVG, tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, String(v));
  if (text) node.textContent = text;
  return node;
}

function drawFlow(nodes, edges, card, { nodeHeight = LAYOUT.nodeHeight } = {}) {
  if (!edges || !edges.length) {
    view = null;
    const list = el("div", { class: "steps" });
    nodes.forEach((node, i) => {
      list.append(card(node, i));
      if (i < nodes.length - 1) list.append(el("div", { class: "connector", "aria-hidden": "true" }));
    });
    return list;
  }
  const g = layoutGraph(nodes, edges, { nodeHeight });
  const flow = el("div", { class: "flow", style: { width: `${g.width}px`, height: `${g.height}px` } });
  const svg = svgEl("svg", { class: "flow-edges", width: g.width, height: g.height, viewBox: `0 0 ${g.width} ${g.height}`, "aria-hidden": "true" });
  svg.append(svgEl("defs", {}), svgEl("g"));
  const defs = svg.firstChild;
  const marker = svgEl("marker", { id: "flow-arrow", viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" });
  marker.append(svgEl("path", { d: "M 0 0 L 10 5 L 0 10 z", class: "flow-arrow" }));
  defs.append(marker);
  const labels = [];
  for (const edge of g.edges) {
    const p = edgePath(edge, g.boxes, g.width);
    if (!p) continue;
    const cls = ["flow-edge", edge.kind === "ai" ? "is-ai" : "", edge.back ? "is-back" : "", edge.label === "error" ? "is-error" : ""].join(" ").trim();
    svg.append(svgEl("path", { d: p.d, class: cls, "marker-end": edge.kind === "ai" ? "" : "url(#flow-arrow)" }));
    if (edge.label) labels.push(el("span", { class: `flow-label${edge.label === "error" ? " is-error" : ""}`, style: { left: `${p.labelAt.x}px`, top: `${p.labelAt.y}px` }, text: edge.label }));
  }
  flow.append(svg);
  nodes.forEach((node, i) => {
    const b = g.boxes[node.name];
    const c = card(node, i);
    c.classList.add("flow-node");
    Object.assign(c.style, { left: `${b.x}px`, top: `${b.y}px`, width: `${b.w}px`, height: `${b.h}px` });
    flow.append(c);
  });
  labels.forEach((l) => flow.append(l));
  const box = el("div", { class: "flow-zoom" }, [flow]);
  view = { flow, box, width: g.width, height: g.height, scale: 1, start: g.boxes[nodes[0]?.name] };
  return box;
}

// ── Zoom and pan ───────────────────────────────────────────────────────────
// The drawing scales as one piece; the scroll box is sized to the scaled
// drawing so scrollbars and trackpad scrolling stay native. Drag the empty
// canvas to pan, ⌘/Ctrl + scroll or pinch to zoom.
let view = null;
function resetView() { view = null; zoomBar.hidden = true; }
const zoomBar = document.getElementById("zoom-bar");
const zoomLevel = document.getElementById("zoom-level");
const MIN_ZOOM = 0.25;
const MAX_ZOOM = 1.5;

function setZoom(scale, anchor) {
  if (!view) return;
  const s = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, scale));
  // Keep the point under the cursor (or the middle of the view) still.
  const rect = canvas.getBoundingClientRect();
  const ax = anchor ? anchor.x - rect.left : canvas.clientWidth / 2;
  const ay = anchor ? anchor.y - rect.top : canvas.clientHeight / 2;
  const off = view.box.offsetLeft;
  const offY = view.box.offsetTop;
  const fx = (canvas.scrollLeft + ax - off) / view.scale;
  const fy = (canvas.scrollTop + ay - offY) / view.scale;
  view.scale = s;
  view.flow.style.transform = `scale(${s})`;
  view.box.style.width = `${view.width * s}px`;
  view.box.style.height = `${view.height * s}px`;
  canvas.scrollLeft = fx * s + off - ax;
  canvas.scrollTop = fy * s + offY - ay;
  zoomLevel.textContent = `${Math.round(s * 100)}%`;
}

// Fit the width when that stays readable; otherwise stop at three-quarter size (still readable) and
// start at the trigger, so a wide fan-out opens on its first step.
function fitFlow() {
  if (!view) { zoomBar.hidden = true; return; }
  zoomBar.hidden = false;
  const room = canvas.clientWidth - 64;
  const fit = Math.min(1, room / view.width);
  setZoom(Math.max(0.75, fit));
  canvas.scrollTop = 0;
  if (view.start && view.width * view.scale > room) {
    const cx = (view.start.x + view.start.w / 2) * view.scale + view.box.offsetLeft;
    canvas.scrollLeft = Math.max(0, cx - canvas.clientWidth / 2);
  } else {
    canvas.scrollLeft = 0;
  }
}

zoomBar.addEventListener("click", (e) => {
  const action = e.target.closest("button")?.dataset.zoom;
  if (!view || !action) return;
  if (action === "in") setZoom(view.scale * 1.2);
  else if (action === "out") setZoom(view.scale / 1.2);
  else if (action === "reset") setZoom(1);
  else if (action === "fit") {
    setZoom(Math.min(1, (canvas.clientWidth - 64) / view.width, (canvas.clientHeight - 64) / view.height));
    canvas.scrollLeft = 0;
    canvas.scrollTop = 0;
  }
});

canvas.addEventListener("wheel", (e) => {
  if (!view || !(e.ctrlKey || e.metaKey)) return;
  e.preventDefault();
  setZoom(view.scale * Math.exp(-e.deltaY * 0.01), { x: e.clientX, y: e.clientY });
}, { passive: false });

let drag = null;
canvas.addEventListener("pointerdown", (e) => {
  if (!view || e.button !== 0 || e.target.closest(".flow-node, button, a, input, textarea, .card, .error-banner")) return;
  drag = { x: e.clientX, y: e.clientY, left: canvas.scrollLeft, top: canvas.scrollTop, id: e.pointerId };
  canvas.setPointerCapture(e.pointerId);
  canvas.classList.add("is-panning");
});
canvas.addEventListener("pointermove", (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  canvas.scrollLeft = drag.left - (e.clientX - drag.x);
  canvas.scrollTop = drag.top - (e.clientY - drag.y);
});
const endDrag = () => { drag = null; canvas.classList.remove("is-panning"); };
canvas.addEventListener("pointerup", endDrag);
canvas.addEventListener("pointercancel", endDrag);

// The workflow list lives at the bottom of the left sidebar, under the
// navigation, so the drawing gets the width. It is one element, moved into
// each freshly rendered sidebar so its search box and scroll position survive.
const wfPane = document.querySelector(".wf-pane");
function mount() {
  const bar = renderSidebar("builder", sidebarCounts);
  bar.classList.add("sidebar-with-list");
  bar.insertBefore(wfPane, bar.querySelector(".sidebar-foot"));
  const existing = shell.querySelector(".sidebar");
  if (existing) existing.replaceWith(bar);
  else shell.prepend(bar);
}

function say(kind, text) {
  const cls = kind === "user" ? "msg-user" : kind === "ok" ? "msg-ok" : kind === "error" ? "msg-error" : "msg-shepherd";
  chat.append(el("div", { class: cls, text }));
  chat.scrollTop = chat.scrollHeight;
}

async function loadWorkflows() {
  try {
    const data = await api("/api/workflows");
    sheet = data.workflows;
    sidebarCounts = { company: sheet.length, findings: sheet.reduce((n, w) => n + (w.findings || 0), 0) };
    mount();
    renderList();
    const requested = new URLSearchParams(location.search).get("id");
    const first = requested ? sheet.find((w) => w.id === requested) : sheet[0];
    if (first) await openWorkflow(first.id);
    else drawEmpty();
  } catch (err) {
    mount();
    clear(canvas); resetView();
    canvas.append(errorBanner(err.message));
  }
}

async function openWorkflow(id) {
  currentDraft = null;
  clear(canvas); resetView();
  canvas.append(el("div", { class: "loading", text: "Loading workflow…" }));
  try {
    const wf = await api(`/api/workflow?id=${encodeURIComponent(id)}`);
    renderWorkflow(wf);
    renderList();
    history.replaceState(null, "", `?id=${encodeURIComponent(id)}`);
  } catch (err) {
    clear(canvas); resetView();
    canvas.append(errorBanner(err.message));
  }
}

function renderWorkflow(wf) {
  title.textContent = wf.name;
  sub.textContent = wf.description || `${wf.nodes.length} steps · updated ${relativeTime(wf.updatedAt)}`;
  state.textContent = wf.active ? "Active" : "Draft";
  openN8n.hidden = false;
  openN8n.href = `/n8n/workflow/${wf.id}`;
  currentId = wf.id;
  historyBtn.hidden = false;

  clear(canvas); resetView();

  const banners = el("div", { class: "canvas-banners" });
  if (wf.writesCompanyData) {
    banners.append(el("div", { class: "error-banner", role: "alert",
      text: `This workflow writes to the shared company database. Only ${ORG.adminName} can approve that.` }));
  }
  if (!wf.secretsClean) {
    for (const f of wf.findings) {
      banners.append(el("div", { class: "error-banner", role: "alert",
        text: `Secret pasted in "${f.node}": ${f.secret}. ${f.fix}` }));
    }
  }
  if (banners.childElementCount) canvas.append(banners);

  const steps = drawFlow(wf.nodes, wf.edges, (node) =>
    el("div", { class: "step" }, [
      logo({ src: node.icon.logo, label: node.icon.label || node.type.split(".").pop(), initials: node.icon.initials, color: node.icon.color, glyph: node.icon.glyph }, "lg"),
      el("div", { class: "step-body" }, [
        el("div", { class: "step-head" }, [
          el("span", { class: "step-name", title: node.name, text: node.name }),
          el("span", { class: "kind", text: node.kind })
        ]),
        el("div", { class: "step-sub", title: `${node.type} · ${node.kind}`, text: [node.icon.label && node.icon.logo ? node.icon.label : null, node.type.split(".").pop(), node.kind].filter(Boolean).join(" · ") })
      ])
    ]));

  canvas.append(steps);
  fitFlow();

  if (wf.lastRun) {
    canvas.append(
      el("div", { class: "canvas-foot" }, [
        el("span", { class: "chip chip-muted", text: `Last run: ${wf.lastRun.status}` }),
        el("span", { class: "small muted", text: relativeTime(wf.lastRun.startedAt) })
      ])
    );
  }
}

function drawEmpty() {
  clear(canvas); resetView();
  canvas.append(el("div", { class: "empty", text: "No workflows on this instance yet. Ask Shepherd to draft one." }));
}

function renderDraft(draft, vet, payload, guard) {
  clear(canvas); resetView();
  title.textContent = draft.name;
  sub.textContent = draft.description || `${draft.steps.length} steps · draft, not yet in n8n`;
  state.textContent = "Draft";
  openN8n.hidden = true;
  historyBtn.hidden = true;
  currentId = null;

  // The payload is what would go to n8n, so draw its real connections.
  const draftNodes = payload.nodes.map((n) => ({ name: n.name, type: n.type, why: n.notes, parameters: n.parameters }));
  const draftEdges = extractEdges(payload, draftNodes);
  const steps = drawFlow(draftNodes, draftEdges, (step, i) =>
    el("div", { class: "step", style: vet.needsApproval ? { borderColor: "#D97706", borderStyle: "dashed" } : {} }, [
      (() => {
        const brand = logoForNode(step.type, step.parameters, step.name);
        const g = glyphFor(step.type, step.name);
        return brand || g
          ? logo({ src: brand && brand.logo, label: (brand && brand.label) || step.type.split(".").pop(), glyph: g && g.glyph, color: g && g.color }, "lg")
          : el("div", { class: "step-icon", style: { background: "#4A55C7" }, text: String(i + 1) });
      })(),
      el("div", { class: "step-body" }, [
        el("div", { class: "step-head" }, [
          el("span", { class: "step-name", title: step.name, text: step.name }),
          el("span", { class: "kind", text: "Draft" })
        ]),
        el("div", { class: "step-sub clamp-2", title: step.why, text: step.why })
      ])
    ]), { nodeHeight: 92 });
  canvas.append(steps);
  fitFlow();

  const actions = el("div", { style: { marginTop: "24px", display: "flex", gap: "8px", flexWrap: "wrap", justifyContent: "center" } });

  if (guard && !guard.ok) {
    actions.append(el("span", { class: "chip chip-stop", text: "Flock will not create this" }));
  } else if (vet.findings.length) {
    actions.append(el("span", { class: "chip chip-stop", text: "Contains a secret literal — cannot be created" }));
  } else if (vet.needsApproval) {
    actions.append(el("span", { class: "chip chip-warn", text: "Touches a high-risk system — needs approval" }));
    actions.append(el("button", {
      class: "btn btn-sm", type: "button", text: `Request approval from ${ORG.adminName}`,
      onclick: async () => {
        try {
          await api("/api/approvals", {
            method: "POST",
            body: JSON.stringify({
              workflowId: "draft",
              draftName: draft.name,
              reason: `Shepherd draft "${draft.name}" touches: ${vet.risky.map((r) => r.node).join(", ")}`,
              risk: "high-risk-system"
            })
          });
          say("ok", `Sent to ${ORG.adminName}. It is on the Shepherd screen now.`);
        } catch (err) {
          say("error", err.message);
        }
      }
    }));
  } else {
    const create = el("button", { class: "btn btn-primary btn-sm", type: "button", text: "Create draft in n8n" });
    // Which existing n8n folder it lands in; the default comes from Settings.
    const folderPick = el("select", { class: "folder-pick", "aria-label": "Folder for this draft", title: "n8n folder for this draft" }, [
      el("option", { value: "", text: "Top level" })
    ]);
    folderPick.hidden = true;
    api("/api/settings").then((st) => {
      if (!st.foldersAvailable || !st.folders.length) return;
      for (const f of st.folders) folderPick.append(el("option", { value: f.id, text: f.path, selected: st.draftsFolder && st.draftsFolder.id === f.id }));
      folderPick.hidden = false;
    }).catch(() => {});
    create.addEventListener("click", async () => {
      create.disabled = true;
      try {
        const body = { payload };
        if (!folderPick.hidden) body.folderId = folderPick.value || null;
        const res = await api("/api/shepherd/create", {
          method: "POST",
          body: JSON.stringify(body)
        });
        const where = res.folder ? ` in the "${res.folder.name}" folder` : "";
        say("ok", `Draft "${res.created.name}" created in n8n${where}. It is unpublished — review and publish it there.`);
        if (res.warning) say("error", res.warning);
        await loadWorkflows();
      } catch (err) {
        say("error", err.message);
        create.disabled = false;
      }
    });
    actions.append(el("span", { class: "folder-pick-wrap" }, [el("span", { class: "small muted", text: "Lands in" }), folderPick]), create);
  }

  canvas.append(actions);

  // The guard's reasons, in plain words: what blocks it and what to watch.
  const reasons = guard ? [
    ...guard.blocked.map((b) => ({ tone: "var(--stop-ink)", text: `Blocked · ${b.why}` })),
    ...guard.warnings.map((w) => ({ tone: "#B45309", text: `Check · ${w.why}` }))
  ] : [];
  if (reasons.length) {
    canvas.append(
      el("div", { class: "card", style: { maxWidth: "520px", margin: "16px auto 0", padding: "12px 14px" } }, [
        el("div", { style: { fontWeight: "600", marginBottom: "6px" }, text: "Shepherd's checks" }),
        ...reasons.map((r) => el("div", { class: "small", style: { color: r.tone }, text: r.text }))
      ])
    );
  }

  if (draft.questions && draft.questions.length) {
    canvas.append(
      el("div", { class: "card", style: { maxWidth: "520px", margin: "16px auto 0", padding: "12px 14px" } }, [
        el("div", { style: { fontWeight: "600", marginBottom: "6px" }, text: "Shepherd needs to know" }),
        ...draft.questions.map((q) => el("div", { class: "small muted", text: `· ${q}` }))
      ])
    );
  }
}

async function submit() {
  const request = ask.value.trim();
  if (!request) return;
  ask.value = "";
  send.disabled = true;
  say("user", request);

  const thinking = el("div", { class: "msg-shepherd", text: "Thinking…" });
  chat.append(thinking);
  chat.scrollTop = chat.scrollHeight;

  try {
    const res = await api("/api/shepherd/draft", {
      method: "POST",
      body: JSON.stringify({ request, history: turns, currentDraft })
    });
    thinking.remove();
    turns.push({ role: "user", content: request });
    if (res.draft) {
      const count = res.draft.steps.length;
      const reply = res.reply || `Drew ${count} step${count === 1 ? "" : "s"} on the left.`;
      say("", `${reply}\nNothing is in n8n until you say so.`);
      const qs = res.draft.questions || [];
      if (qs.length) say("", `Before this can run:\n${qs.map((q) => `· ${q}`).join("\n")}\nJust answer here and I will update the drawing.`);
      turns.push({ role: "assistant", content: [reply, ...qs.map((q) => `Question: ${q}`)].join("\n") });
      currentDraft = res.draft;
      renderDraft(res.draft, res.vet, res.payload, res.guard);
    } else {
      say("", res.reply);
      turns.push({ role: "assistant", content: res.reply });
    }
  } catch (err) {
    thinking.remove();
    say("error", err.message);
  } finally {
    send.disabled = false;
    ask.focus();
  }
}

send.addEventListener("click", submit);
ask.addEventListener("keydown", (e) => {
  // Enter sends, like any chat; Shift+Enter adds a line.
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    submit();
  }
});

historyBtn.addEventListener("click", async () => {
  if (!currentId) return;
  historyBtn.disabled = true;
  try {
    const data = await api(`/api/history?id=${encodeURIComponent(currentId)}`);
    if (!data.versions || data.versions.length === 0) {
      say("", "This workflow has no saved versions yet.");
      return;
    }
    const lines = data.versions
      .slice(0, 8)
      .map((v) => {
        const who = v.authors ? ` · ${v.authors}` : "";
        const nodes = v.nodeCount === null ? "" : ` · ${v.nodeCount} nodes`;
        return `${relativeTime(v.createdAt)}${who}${nodes}`;
      });
    say("", `Version history:\n${lines.join("\n")}`);
  } catch (err) {
    // Version history needs a scope the key may not have; say which.
    say("error", err.status === 403
      ? "Version history needs the workflow:read scope on the n8n API key."
      : err.message);
  } finally {
    historyBtn.disabled = false;
  }
});

// Shepherd sits under the drawing. It grows with the chat up to a third of
// the space; drag its top edge to set a height, double-click to go back.
const panel = document.getElementById("shepherd-panel");
const grip = document.getElementById("shepherd-grip");
const HEIGHT_KEY = "flock.shepherdHeight";
function setPanelHeight(px) {
  if (!px) {
    panel.style.height = "";
    panel.classList.remove("is-sized");
    return;
  }
  const room = panel.parentElement.clientHeight;
  const h = Math.max(150, Math.min(px, room - 160));
  panel.style.height = `${h}px`;
  panel.classList.add("is-sized");
}
try { setPanelHeight(Number(localStorage.getItem(HEIGHT_KEY)) || 0); } catch {}
let sizing = null;
grip.addEventListener("pointerdown", (e) => {
  sizing = { y: e.clientY, h: panel.getBoundingClientRect().height };
  grip.setPointerCapture(e.pointerId);
  e.preventDefault();
});
grip.addEventListener("pointermove", (e) => {
  if (sizing) setPanelHeight(sizing.h + (sizing.y - e.clientY));
});
grip.addEventListener("pointerup", () => {
  if (!sizing) return;
  sizing = null;
  try { localStorage.setItem(HEIGHT_KEY, String(Math.round(panel.getBoundingClientRect().height))); } catch {}
});
grip.addEventListener("dblclick", () => {
  setPanelHeight(0);
  try { localStorage.removeItem(HEIGHT_KEY); } catch {}
});

say("", "Hi. Ask me anything about your workflows or n8n, or tell me what you want automated. I will ask what I need, draw it, check it, and leave it as a draft.");
loadWorkflows();
</script>
</body>
